</style><header><b>WORD PRACTICE</b><span>기말 대비 · 영어 쓰기</span></header><main><section id="setup"><div class="tag">KOREAN → ENGLISH</div><h1>뜻을 보고,<br>영어로 기억하기.</h1><p>한글 뜻이 나오면 영어 단어나 표현을 적어보세요.<br>매번 새로운 순서로, 중복 없이 출제해요.</p><div class="card"><label for="count">몇 문제를 풀까요?</label><div class="row"><input id="count" type="number" min="1" value="10"><span id="total" class="muted">단어장 불러오는 중</span></div><div class="row choices" id="choices"></div><button id="start" disabled>퀴즈 시작하기 →</button><p class="muted">대소문자·앞뒤 공백은 무시해요. 철자와 단어 사이 띄어쓰기는 확인해요.</p></div></section><section id="quiz" hidden><div class="top"><span class="tag">WRITE THE WORD</span><button class="secondary" id="exit">처음으로</button></div><div class="card"><div class="top"><b id="progress"></b><span id="correctCount" class="muted"></span></div><div class="bar"><div id="fill"></div></div><div class="meaning" id="meaning"></div><form id="form"><label class="muted" for="answer">영어 정답</label><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="영어를 입력하세요"><div id="feedback" role="status" hidden></div><div class="actions"><button type="button" class="secondary" id="skip">모르겠어요</button><button id="submit" type="submit">정답 확인</button></div></form></div><p class="muted">Enter 키로 정답을 확인하고 다음 문제로 넘어갈 수 있어요.</p></section><section id="result" hidden><div class="tag">SESSION COMPLETE</div><h1>오늘의 퀴즈 완료.</h1><div class="card"><div class="score" id="score"></div><p id="summary"></p><div class="row"><button id="retry">틀린 단어 다시 풀기</button><button class="secondary" id="again">새 퀴즈 만들기</button></div></div><h2>풀이 기록</h2><div id="reviews"></div></section></main><footer>첨부 단어장에 있는 단어와 뜻으로만 구성했어요.</footer><script>
