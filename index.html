function bracketVarsEnglish(text){var v=[text,text.replace(/\[([^\]]+)\]/g,'')],m=/^(.*?)([^\s\[]+)\[([^\]]+)\](.*)$/.exec(text);if(m){v.push(m[1]+m[2]+m[4]);v.push(m[1]+m[3]+m[4])}return v}
function engVars(ans){var v=[ans],p=ans.split('/'),i,j,b,m,base;for(i=0;i<p.length;i++){v.push(p[i]);b=bracketVarsEnglish(p[i]);for(j=0;j<b.length;j++)v.push(b[j]);base=p[i].replace(/\(([^)]*)\)/g,'').trim();v.push(base);m=/\(([^)]*)\)/.exec(p[i]);if(m){if(/^[A-Za-z -]+$/.test(m[1].trim()))v.push(p[i].replace(/\(([^)]*)\)/,m[1]).replace(/\s+/g,' ').trim());var ew=m[1].match(/[A-Za-z]+(?:[- ][A-Za-z]+)*/g);if(ew)for(j=0;j<ew.length;j++)v.push(ew[j].replace(/^plural\s+/i,''))}}return uniq(v)}
function isCorrect(input,answer,dir){var n=norm(input),v=(dir==='en-ko'?korVars(answer):engVars(answer)),i;if(!n)return false;for(i=0;i<v.length;i++)if(norm(v[i])===n)return true;return false}
function makeItem(w){return {no:w.no,en:w.en,ko:w.ko,dir:(mode==='mix'?(Math.random()<.5?'en-ko':'ko-en'):mode)}}
function render(items){var q=byId('quiz'),i,w,d,prompt,hint,inp;current=items;wrongItems=[];q.innerHTML='';for(i=0;i<items.length;i++){w=items[i];d=document.createElement('div');d.className='q';d.dataset.i=i;prompt=w.dir==='en-ko'?w.en:w.ko;hint=w.dir==='en-ko'?'한글 입력':'영어 입력';d.innerHTML='<div class="qhead"><div class="num">'+(i+1)+'</div><div class="prompt"></div><div class="hint">'+hint+'</div></div><input autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="정답 입력"><div class="answer"></div>';d.querySelector('.prompt').textContent=prompt;inp=d.querySelector('input');(function(idx){inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var nx=q.querySelector('[data-i="'+(idx+1)+'"] input');if(nx)nx.focus();else grade()}})})(i);q.appendChild(d)}byId('result').className='result';byId('retry').className='retry';window.scrollTo({top:0,behavior:'smooth'})}
function buildQuiz(){var a=shuffle(window.WORDS).slice(0,10),out=[],i;for(i=0;i<a.length;i++)out.push(makeItem(a[i]));render(out)}
function grade(){var els=document.querySelectorAll('.q'),score=0,miss=[],i,w,inp,ans,ok,a;wrongItems=[];for(i=0;i<els.length;i++){w=current[i];inp=els[i].querySelector('input');ans=w.dir==='en-ko'?w.ko:w.en;ok=isCorrect(inp.value,ans,w.dir);els[i].className='q graded '+(ok?'correct':'wrong');a=els[i].querySelector('.answer');if(ok){score++;a.innerHTML='<span class="oktxt">정답</span>'}else{miss.push(i+1);wrongItems.push(w);a.innerHTML='<span class="notxt">오답</span> · 정답: <strong></strong> <span class="desc">(단어장 '+w.no+'번)</span>';a.querySelector('strong').textContent=ans}}byId('score').textContent=score+' / '+current.length;byId('missed').textContent=miss.length?('틀린 번호: '+miss.join(', ')):'전부 정답!';byId('result').className='result show';byId('retry').className=wrongItems.length?'retry show':'retry'}
var btns=document.querySelectorAll('.modes button');for(var i=0;i<btns.length;i++)btns[i].addEventListener('click',function(){for(var j=0;j<btns.length;j++)btns[j].className='';this.className='active';mode=this.dataset.mode;buildQuiz()});
byId('grade').addEventListener('click',grade);byId('new').addEventListener('click',buildQuiz);byId('retry').addEventListener('click',function(){if(wrongItems.length)render(wrongItems.slice())});
if(!window.WORDS||window.WORDS.length!==506){document.body.innerHTML='<div style="padding:30px;font-family:sans-serif">단어 데이터를 불러오지 못했어요. 새로고침해 주세요.</div>';return}
buildQuiz();
})();
</script>
</body></html>
