<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감염관리 의학용어 36문항</title><style>body{margin:0;background:#f5f6fa;color:#202536;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 80px}h1{font-size:25px;margin-bottom:5px}.sub{color:#667085;font-size:14px}.panel,.question{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #10182808}select,button{font:inherit;border-radius:10px;padding:11px 14px}select{border:1px solid #ccd2db;background:white;max-width:100%}button{border:0;background:#334fba;color:white;font-weight:700;cursor:pointer}button.secondary{background:#e9edfa;color:#334fba}.bar{height:9px;background:#e6e9f1;border-radius:9px;overflow:hidden}.fill{height:100%;background:#5474e6;width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.num{color:#5867a5;font-size:13px;font-weight:700}.prompt{font-size:19px;font-weight:700;margin:12px 0 16px;overflow-wrap:anywhere}.option{display:flex;align-items:flex-start;gap:11px;padding:13px;margin:8px 0;border:1px solid #dce1eb;border-radius:11px;cursor:pointer;line-height:1.5;overflow-wrap:anywhere}.option:has(input:checked){border-color:#5474e6;background:#f0f3ff}.option input{margin-top:5px;accent-color:#4264cf}.correct{border-color:#22a06b!important;background:#eaf8f0!important}.wrong{border-color:#d92d20!important;background:#fff0ee!important}.feedback{margin-top:12px;font-size:14px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.score{font-size:25px;font-weight:800}.hidden{display:none}.note{font-size:13px;color:#667085}#quiz{scroll-margin-top:10px}</style></head><body><main class="wrap"><h1>감염관리 의학용어 퀴즈</h1><p class="sub">교재 14·19쪽 · 36문항 · 5지선다 · 자동 채점</p><section class="panel"><div class="top"><label>출제 방식 <select id="mode"><option value="mixed">한영 + 영한 랜덤</option><option value="ko">한 → 영</option><option value="en">영 → 한</option></select></label><button id="start">새 시험 시작</button></div><p class="note">문제와 보기 순서는 시험을 시작할 때마다 바뀝니다. 채점 전까지 정답은 표시되지 않습니다.</p><div class="top"><span id="progressText">0 / 36 답변</span><span id="status"></span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section id="result" class="panel hidden"></section><div id="quiz"></div><div class="actions"><button id="grade">채점하고 정답 확인</button><button class="secondary" id="restart">다시 풀기</button></div></main><script>
const data=[
['Hygiene','위생'],['Medical asepsis','내과적 무균술'],['Surgical asepsis','외과적 무균술'],['Aseptic','무균의'],['Sepsis','패혈증'],['Septicemia','패혈증'],['Disinfection','소독'],['Clean','청결한, 깨끗한'],['Culture','배양'],['MRSA (Methicillin-resistant Staphylococcus aureus)','메티실린 내성 황색포도알균'],['VRE (Vancomycin-resistant Enterococci)','반코마이신 내성 장알균'],['Infection','감염'],['Isolation','격리'],['Immunity','면역'],['Surgical hand scrub','외과적 손씻기'],['Inflammation','염증'],['Sterilization','멸균'],['Cleansing','세척'],['Antigen-antibody','항원-항체'],['Disinfectant','소독제'],['Germicide','살균제'],['Steam sterilization','증기멸균'],['Asepsis','무균법, 무균상태'],['Precautions','주의, 예방조치'],['Contamination','오염'],['Standard precautions','표준주의'],['Contact precautions','접촉주의'],['PPE (Personal protective equipment)','개인보호구'],['Chemical sterilant','화학적 멸균제'],['Antiseptics','방부제, 피부조직 소독제'],['Autoclave','고압증기 멸균기'],['Radiation','방사선'],['Reverse isolation','역격리 (보호격리)'],['EO (Ethylene oxide)','가스멸균제'],['Airborne precautions','공기주의'],['Droplet precautions','비말주의']];
const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let questions=[],answers={},graded=false;
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){graded=false;answers={};$('#result').classList.add('hidden');let mode=$('#mode').value;questions=shuffle(data.map((d,i)=>({id:i,dir:mode==='mixed'?(Math.random()<.5?'ko':'en'):mode}))).map(q=>{let col=q.dir==='ko'?0:1,other=shuffle(data.filter((d,i)=>i!==q.id&&d[1]!==data[q.id][1])).slice(0,4);return {...q,options:shuffle([data[q.id],...other].map(d=>d[col]))}});render();update();}
function render(){let root=$('#quiz');root.innerHTML='';questions.forEach((q,n)=>{let col=q.dir==='ko'?0:1,ask=1-col,el=document.createElement('section');el.className='question';el.innerHTML=`<div class="num">문제 ${n+1} / 36 · ${q.dir==='ko'?'한 → 영':'영 → 한'}</div><div class="prompt">${escapeHtml(data[q.id][ask])}</div>`+q.options.map((opt,i)=>`<label class="option" data-index="${i}"><input type="radio" name="q${n}" value="${i}" ${answers[n]===i?'checked':''} ${graded?'disabled':''}><span>${i+1}. ${escapeHtml(opt)}</span></label>`).join('')+`<div class="feedback" hidden></div>`;root.append(el);el.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{answers[n]=Number(input.value);update()}));if(graded){let correct=q.options.indexOf(data[q.id][col]);el.querySelectorAll('.option').forEach((node,i)=>{if(i===correct)node.classList.add('correct');if(i===answers[n]&&i!==correct)node.classList.add('wrong')});let f=el.querySelector('.feedback');f.hidden=false;f.innerHTML=(answers[n]===correct?'✓ 정답':'✕ 오답')+` · 정답: <strong>${escapeHtml(data[q.id][col])}</strong>`}})}
function update(){let count=Object.keys(answers).length;$('#progressText').textContent=`${count} / 36 답변`;$('#fill').style.width=(count/36*100)+'%';$('#status').textContent=graded?'채점 완료':''}
function grade(){if(graded)return;let missing=36-Object.keys(answers).length;if(missing&&!confirm(`${missing}문항을 풀지 않았습니다. 미응답은 오답으로 처리하고 채점할까요?`))return;graded=true;let right=questions.reduce((s,q,n)=>s+(q.options[answers[n]]===data[q.id][q.dir==='ko'?0:1]?1:0),0);let box=$('#result');box.classList.remove('hidden');box.innerHTML=`<div class="score">${right} / 36점 (${Math.round(right/36*100)}%)</div><p>정답 ${right}개 · 오답 및 미응답 ${36-right}개</p><p class="note">각 문제에서 초록색은 정답, 빨간색은 선택한 오답입니다.</p><button class="secondary" id="wrongBtn">오답부터 보기</button>`;render();update();$('#wrongBtn').onclick=()=>{let n=questions.findIndex((q,i)=>q.options[answers[i]]!==data[q.id][q.dir==='ko'?0:1]);if(n>=0)$('#quiz').children[n].scrollIntoView({behavior:'smooth',block:'start'});else alert('전부 정답입니다!')};box.scrollIntoView({behavior:'smooth',block:'start'})}
$('#start').onclick=start;$('#restart').onclick=()=>{start();window.scrollTo({top:0,behavior:'smooth'})};$('#grade').onclick=grade;start();
</script></body></html>
